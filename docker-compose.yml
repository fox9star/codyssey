# ==============================================================================
# Codyssey Mission 1 - Bonus Task: Docker Compose (Single & Multi-Container)
# Services:
#   1. web: Custom NGINX web server built from ./Dockerfile
#   2. api: Companion Python JSON API server verifying service discovery & volume
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: codyssey-web:1.0
    container_name: codyssey-compose-web
    ports:
      - "${HOST_PORT:-8082}:${SERVER_PORT:-80}"
    environment:
      APP_ENV: "${APP_ENV:-compose-staging}"
      APP_VERSION: "${APP_VERSION:-1.1.0}"
      SERVER_PORT: "${SERVER_PORT:-80}"
    depends_on:
      - api
    networks:
      - codyssey-net
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: codyssey-api:1.0
    container_name: codyssey-compose-api
    volumes:
      - codyssey-compose-data:/data
    environment:
      APP_ENV: "${APP_ENV:-compose-staging}"
      API_PORT: "${API_PORT:-5000}"
      DATA_FILE: "/data/requests.log"
    expose:
      - "${API_PORT:-5000}"
    networks:
      - codyssey-net
    restart: unless-stopped

volumes:
  codyssey-compose-data:
    name: codyssey-compose-data

networks:
  codyssey-net:
    name: codyssey-net
    driver: bridge
